name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare preview folder
        run: |
          mkdir -p pr-${{ github.event.pull_request.number }}
          cp -r ./* pr-${{ github.event.pull_request.number }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pr-${{ github.event.pull_request.number }}

  comment:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;

            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-${pr}/`;

            const marker = '<!-- pr-preview-link -->';
            const body = `${marker}\n🚀 Preview: ${url}`;

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: pr,
            });

            const existing = comments.find(c =>
              c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pr,
                body,
              });
            }